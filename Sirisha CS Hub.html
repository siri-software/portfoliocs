<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>Sirisha portfolio</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    /* Layout: fixed canvas network behind a sticky glass nav; one section visible at a time, routed by hash. */
    :root {
      --bg: #050b1f;
      --bg2: #0a1535;
      --panel: rgba(16, 32, 72, .55);
      --panel-solid: #0d1b40;
      --line: rgba(90, 170, 255, .22);
      --fg: #e6f0ff;
      --mute: #8fa8d4;
      --blue: #2f7bff;
      --cyan: #22d3ee;
      --glow: rgba(47, 123, 255, .45);
      --ok: #34d399;
      --bad: #fb7185;
      --warn: #fbbf24;
      color-scheme: dark;
      --head: 'Space Grotesk', system-ui, sans-serif;
      --body: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: radial-gradient(1200px 700px at 80% -10%, #0f2a6b 0%, transparent 60%), radial-gradient(900px 600px at -10% 40%, #06307a55 0%, transparent 60%), var(--bg);
      color: var(--fg);
      font: 15px/1.6 var(--body);
      margin: 0;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      min-height: 100vh
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding-block: 0 60px
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--head);
      margin: 0;
      text-wrap: balance;
      line-height: 1.15
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      letter-spacing: -.02em
    }

    h2 {
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      margin-bottom: 6px
    }

    h3 {
      font-size: 1.15rem
    }

    p {
      margin: 0 0 .8em
    }

    a {
      color: var(--cyan)
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px
    }

    .grad {
      background: linear-gradient(90deg, #7cc4ff, var(--cyan) 50%, #6ea0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    .mono {
      font-family: var(--mono)
    }

    .eyebrow {
      font: 500 .72rem var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--cyan)
    }

    .muted {
      color: var(--mute)
    }

    /* nav */
    nav.top {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      margin: 10px 0 24px;
      background: rgba(7, 16, 40, .72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow-x: auto;
      scrollbar-width: none
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0 0 auto;
      height: env(safe-area-inset-top, 0px);
      z-index: 30;
      background: var(--bg)
    }

    nav.top::-webkit-scrollbar {
      display: none
    }

    .brand {
      font: 700 1.05rem var(--head);
      white-space: nowrap;
      margin-right: 8px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .brand i {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: conic-gradient(from 200deg, var(--blue), var(--cyan), var(--blue));
      box-shadow: 0 0 14px var(--glow);
      display: inline-block
    }

    nav.top a {
      color: var(--mute);
      text-decoration: none;
      padding: 7px 12px;
      border-radius: 10px;
      font-weight: 500;
      font-size: .88rem;
      white-space: nowrap;
      transition: .2s
    }

    nav.top a:hover {
      color: var(--fg);
      background: rgba(47, 123, 255, .15)
    }

    nav.top a.on {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #1a54c9);
      box-shadow: 0 0 16px var(--glow)
    }

    nav.top .sp {
      flex: 1
    }

    /* glass + 3D cards */
    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 40px rgba(0, 10, 40, .45), inset 0 1px 0 rgba(255, 255, 255, .06)
    }

    .pad {
      padding: 20px
    }

    .tilt {
      transform-style: preserve-3d;
      transition: transform .15s ease, box-shadow .25s, border-color .25s;
      will-change: transform
    }

    .tilt:hover {
      border-color: rgba(34, 211, 238, .6);
      box-shadow: 0 18px 50px rgba(20, 90, 255, .35), 0 0 0 1px rgba(34, 211, 238, .25)
    }

    .tilt>* {
      transform: translateZ(18px)
    }

    .grid {
      display: grid;
      gap: 16px
    }

    .g2 {
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr))
    }

    .g3 {
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr))
    }

    .g4 {
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr))
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center
    }

    .btn {
      border: 1px solid var(--line);
      background: rgba(47, 123, 255, .14);
      padding: 9px 16px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: .2s
    }

    .btn:hover {
      background: rgba(47, 123, 255, .3);
      box-shadow: 0 0 16px var(--glow)
    }

    .btn.pri {
      background: linear-gradient(135deg, var(--blue), #1a54c9);
      border-color: transparent;
      color: #fff
    }

    .btn.sm {
      padding: 5px 10px;
      font-size: .82rem
    }

    .btn:disabled {
      opacity: .5;
      cursor: default
    }

    .chip {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font: 500 .74rem var(--mono);
      background: rgba(34, 211, 238, .1);
      border: 1px solid rgba(34, 211, 238, .3);
      color: #a5f0ff
    }

    .chip.on {
      background: var(--cyan);
      color: #021226
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    input,
    select,
    textarea {
      background: rgba(5, 12, 34, .7);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      width: 100%;
      min-width: 0
    }

    textarea {
      resize: vertical;
      min-height: 70px
    }

    label {
      display: block;
      font-size: .8rem;
      color: var(--mute);
      margin: 10px 0 4px
    }

    .hero {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 24px;
      align-items: center;
      padding: 30px
    }

    .avatar {
      width: min(210px, 60vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(from 160deg, var(--blue), var(--cyan), #6ea0ff, var(--blue));
      padding: 4px;
      box-shadow: 0 0 50px var(--glow);
      margin: auto;
      animation: float 6s ease-in-out infinite
    }

    .avatar>div {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--panel-solid) center/cover;
      display: grid;
      place-items: center;
      font: 700 3.4rem var(--head);
      color: var(--cyan)
    }

    @keyframes float {
      50% {
        transform: translateY(-10px)
      }
    }

    .sec-head {
      margin: 34px 0 14px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      flex-wrap: wrap
    }

    .bar {
      height: 8px;
      border-radius: 9px;
      background: rgba(255, 255, 255, .08);
      overflow: hidden
    }

    .bar>i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      box-shadow: 0 0 10px var(--glow)
    }

    pre,
    code {
      font-family: var(--mono);
      font-size: .84rem
    }

    pre {
      background: #030813;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      overflow-x: auto;
      margin: 8px 0;
      color: #bfe3ff
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .tabs button {
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 10px;
      padding: 6px 13px;
      cursor: pointer;
      color: var(--mute)
    }

    .tabs button.on {
      background: rgba(47, 123, 255, .3);
      color: #fff;
      border-color: var(--blue)
    }

    .opt {
      display: block;
      width: 100%;
      text-align: left;
      margin: 6px 0;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(10, 24, 60, .6);
      cursor: pointer
    }

    .opt:hover {
      border-color: var(--cyan)
    }

    .opt.ok {
      background: rgba(52, 211, 153, .2);
      border-color: var(--ok)
    }

    .opt.bad {
      background: rgba(251, 113, 133, .2);
      border-color: var(--bad)
    }

    .calc {
      max-width: 380px;
      margin: auto
    }

    .disp {
      background: #030813;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: right;
      font: 500 1.7rem var(--mono);
      min-height: 62px;
      overflow: hidden;
      word-break: break-all
    }

    .disp small {
      display: block;
      font-size: .8rem;
      color: var(--mute);
      min-height: 1.2em
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px
    }

    .keys button {
      padding: 13px 0;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(20, 44, 100, .5);
      cursor: pointer;
      font: 500 1rem var(--mono)
    }

    .keys button:hover {
      background: rgba(47, 123, 255, .4)
    }

    .keys .op {
      background: rgba(34, 211, 238, .18)
    }

    .keys .eq {
      background: var(--blue);
      color: #fff
    }

    .mem {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px
    }

    .mem .memcell {
      aspect-ratio: 1;
      border-radius: 12px;
      background: linear-gradient(135deg, #0d2a6b, #123a8f);
      display: grid;
      place-items: center;
      cursor: pointer;
      border: 1px solid var(--line);
      font-size: 1.5rem;
      transition: transform .35s;
      transform-style: preserve-3d
    }

    .mem .memcell.up {
      background: linear-gradient(135deg, #0e7490, #22d3ee);
      color: #021226;
      transform: rotateY(360deg)
    }

    .mem .memcell.done {
      background: rgba(52, 211, 153, .35)
    }

    .timer {
      font: 600 1.1rem var(--mono);
      color: var(--cyan)
    }

    table {
      border-collapse: collapse;
      width: 100%
    }

    td,
    th {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      text-align: left
    }

    .scroll {
      overflow-x: auto
    }

    .tl {
      border-left: 2px solid var(--line);
      padding-left: 18px;
      margin-left: 6px
    }

    .tl>div {
      position: relative;
      margin-bottom: 18px
    }

    .tl>div::before {
      content: "";
      position: absolute;
      left: -25px;
      top: 6px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan)
    }

    .cert {
      position: relative;
      overflow: hidden
    }

    .cert::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, .08) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform .7s
    }

    .cert:hover::after {
      transform: translateX(100%)
    }

    .thumb {
      height: 130px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0d2a6b, #0a6f8f);
      display: grid;
      place-items: center;
      font: 700 2.2rem var(--head);
      color: rgba(255, 255, 255, .85);
      background-size: cover;
      background-position: center;
      margin-bottom: 12px
    }

    .fab {
      position: fixed;
      right: max(18px, env(safe-area-inset-right, 0px));
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      z-index: 40;
      border: 0;
      border-radius: 99px;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      color: #021226;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 30px var(--glow)
    }

    .chat {
      position: fixed;
      right: max(18px, env(safe-area-inset-right, 0px));
      bottom: calc(78px + env(safe-area-inset-bottom, 0px));
      z-index: 40;
      width: min(380px, calc(100vw - 32px));
      height: min(520px, 70vh);
      display: flex;
      flex-direction: column;
      background: var(--panel-solid)
    }

    .chat .log {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .msg {
      padding: 9px 13px;
      border-radius: 14px;
      max-width: 88%;
      white-space: pre-wrap;
      word-wrap: break-word
    }

    .msg.u {
      align-self: flex-end;
      background: var(--blue)
    }

    .msg.a {
      align-self: flex-start;
      background: rgba(255, 255, 255, .07)
    }

    .chat[hidden],
    .toast[hidden] {
      display: none
    }

    .toast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      background: var(--panel-solid);
      border: 1px solid var(--cyan);
      padding: 10px 18px;
      border-radius: 12px;
      z-index: 60
    }

    .lvl {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 8px;
      font-size: .72rem;
      font-weight: 600
    }

    .lvl.Beginner {
      background: rgba(52, 211, 153, .2);
      color: #6ee7b7
    }

    .lvl.Intermediate {
      background: rgba(251, 191, 36, .2);
      color: #fcd34d
    }

    .lvl.Advanced {
      background: rgba(251, 113, 133, .2);
      color: #fda4af
    }

    .adm-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      margin-bottom: 10px
    }

    @media(max-width:760px) {
      .hero {
        grid-template-columns: 1fr;
        padding: 20px
      }

      .avatar {
        order: -1;
        width: 150px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="app">
    <nav class="top" id="nav" aria-label="Sections"></nav>
    <main id="view"></main>
  </div>
  <button class="fab" id="fab" type="button">✦ Ask AI</button>
  <section class="chat glass" id="chat" hidden aria-label="AI assistant">
    <div class="pad row" style="justify-content:space-between;border-bottom:1px solid var(--line)">
      <strong>AI Assistant</strong><button class="btn sm" id="chatx" type="button">Close</button>
    </div>
    <div class="log" id="log"></div>
    <form class="pad row" id="chatf" style="flex-wrap:nowrap;border-top:1px solid var(--line)">
      <input id="chatin" placeholder="Ask a CS question…" autocomplete="off">
      <button class="btn pri" type="submit" id="chatgo">Send</button>
    </form>
  </section>
  <div class="toast" id="toast" hidden></div>
  <script>
    const DEFAULTS = {

        view.innerHTML = `<div class="sec-head"><div><div class="eyebrow">Admin</div><h2>Edit site content</h2><div class="muted">Changes are saved to the page's shared database and appear for every visitor.</div></div><button class="btn pri" id="save" type="button">Save changes</button></div>
  <section class="glass pad"><h3>Personal information</h3><div class="adm-row" style="border:0;padding:0">${PF.map(f => fld("profile", 0, f, D.profile[f[0]] || "")).join("")}</div></section>
  ${Object.entries(LISTS).map(([s, L]) => `<section class="glass pad" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h3>${L.t}</h3><button class="btn sm" data-add="${s}" type="button">+ Add</button></div>${D[s].map((it, i) => `<div class="adm-row">${L.f.map(f => fld(s, i, f, it[f[0]] || "")).join("")}<div><button class="btn sm" data-del="${s}:${i}" type="button">Remove</button></div></div>`).join("") || '<p class="muted">Nothing yet.</p>'}</section>`).join("")}`;
      };
      const collect = () => { view.querySelectorAll("[data-k]").forEach(el => { const { s, i, k } = el.dataset; const t = s === "profile" ? D.profile : D[s][+i]; if (!t) return; const v = el.value.trim(); if (el.type !== "file" && (v || !(t[k] || "").startsWith("data:"))) t[k] = v }) };
      draw();
      view.onclick = async e => {
        const a = e.target.closest("[data-add]"), d = e.target.closest("[data-del]");
        if (a) { collect(); D[a.dataset.add].push({ id: "i" + Date.now().toString(36), ...LISTS[a.dataset.add].blank }); draw() }
        else if (d) { collect(); const [s, i] = d.dataset.del.split(":"); D[s].splice(+i, 1); draw() }
        else if (e.target.id === "save") {
          collect();
          if (!ctx.db) { toast("Database unavailable, cannot save"); return }
          const body = JSON.stringify(D); if (body.length > 240000) { toast("Too much data (images?). Use smaller images or URLs."); return }
          try { await ctx.db.doc("site/content").set(D); C = mergeC(D); toast("Saved") } catch (err) { toast("Save failed: " + (err.code || "error")) }
        }
      };
      view.onchange = async e => {
        const f = e.target; if (f.type !== "file" || !f.files[0]) return;
        const id = f.dataset.up, t = document.getElementById(id); collect();
        try { const max = t.dataset.k === "photo" ? 240 : 520; const url = await shrink(f.files[0], max, .7); const { s, i, k } = t.dataset; (s === "profile" ? D.profile : D[s][+i])[k] = url; draw(); toast("Image added. Remember to save.") } catch (x) { toast("Could not read that image") }
      };
    }
    function mergeC(d) { const m = JSON.parse(JSON.stringify(DEFAULTS)); if (d) { Object.assign(m.profile, d.profile || {}); for (const k of ["projects", "certs", "exp"]) if (Array.isArray(d[k])) m[k] = d[k] } return m }

    /* ---------- AI chat ---------- */
    const turns = []; let chatBusy = false;
    function openChat() { $("#chat").hidden = false; if (!$("#log").children.length) addMsg("a", "Hi! Ask me about any CS topic, a bug, an interview question, or these projects."); $("#chatin").focus() }
    function addMsg(r, t) { const m = document.createElement("div"); m.className = "msg " + r; m.textContent = t; $("#log").append(m); $("#log").scrollTop = 1e9; return m }
    $("#fab").onclick = () => { $("#chat").hidden ? openChat() : ($("#chat").hidden = true) };
    $("#chatx").onclick = () => $("#chat").hidden = true;
    $("#chatf").onsubmit = async e => {
      e.preventDefault(); const inp = $("#chatin"), q = inp.value.trim(); if (!q || chatBusy) return;
      addMsg("u", q); inp.value = "";
      if (!ctx.sample) { addMsg("a", "The AI assistant is not available in this view."); return }
      chatBusy = true; $("#chatgo").disabled = true; const b = addMsg("a", "Thinking…");
      const p = C.profile;
      const rules = `You are the friendly study assistant inside ${p.name}'s computer science hub. Explain clearly for a CS student, keep answers under 200 words, use short code blocks only when helpful, and never invent facts about the owner. Owner profile: ${p.title}. Skills: ${p.skills}. Projects: ${C.projects.map(x => x.title).join("; ")}.`;
      turns.push({ role: "user", content: q });
      try {
        const r = await ctx.sample([{ role: "user", content: rules }, ...turns.slice(-8)], { cache: false, modelTier: "quick", onText: ({ text }) => { b.textContent = text; $("#log").scrollTop = 1e9 } });
        turns.push({ role: "assistant", content: r.text }); b.textContent = r.text
      }
      catch (err) { turns.pop(); b.textContent = err.code === "not_granted" ? "Permission to use Claude was declined." : err.code === "rate_limited" ? "Too many requests. Please try again in a moment." : (err.text || "Sorry, I could not answer that. Please try again.") }
      chatBusy = false; $("#chatgo").disabled = false;
    };

    /* ---------- animated background ---------- */
    (function () {
      const cv = $("#bg"), g = cv.getContext("2d"); let W, H, pts = [];
      const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const size = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; pts = Array.from({ length: Math.min(80, Math.floor(W * H / 18000)) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35 })) };
      const frame = () => {
        g.clearRect(0, 0, W, H);
        for (const p of pts) {
          if (!rm) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1 }
          g.fillStyle = "rgba(34,211,238,.7)"; g.beginPath(); g.arc(p.x, p.y, 1.6, 0, 6.3); g.fill()
        }
        for (let i = 0; i < pts.length; i++)for (let j = i + 1; j < pts.length; j++) { const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y, d = dx * dx + dy * dy; if (d < 19000) { g.strokeStyle = `rgba(70,150,255,${.28 * (1 - d / 19000)})`; g.beginPath(); g.moveTo(pts[i].x, pts[i].y); g.lineTo(pts[j].x, pts[j].y); g.stroke() } }
        if (!rm) requestAnimationFrame(frame)
      };
      addEventListener("resize", () => { size(); if (rm) frame() }); size(); frame();
    })();

    /* ---------- boot ---------- */
    async function boot() {
      route();
      const get = async n => { try { return await claude.use(n) } catch (e) { return null } };
      if (!window.claude) return;
      const [db, user, sample, downloads] = await Promise.all([get("db"), get("user"), get("sample"), get("downloads")]);
      ctx.db = db; ctx.sample = sample; ctx.downloads = downloads;
      try { if (user) { ctx.uid = await user.id(); ctx.isAdmin = await user.canEdit() } } catch (e) { }
      drawNav();
      if (db) { try { db.doc("site/content").onSnapshot(s => { if (s.exists) { C = mergeC(s.data()); if (/^#?(home|profile|projects|certs|exp)?(\/.*)?$/.test(location.hash || "#home")) route() } }, () => { }) } catch (e) { } }
      if ((location.hash || "").indexOf("#admin") === 0) route();
    }
    boot();
  </script>

</body>
